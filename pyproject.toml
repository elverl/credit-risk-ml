[project]
name = "credit-risk-ml"
version = "0.1.0"
description = "Reproducible credit risk modeling pipeline with model benchmarking, explainability, and MLE practices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.4.0",
    "ipykernel>=7.2.0",
    "lightgbm>=4.6.0",
    "mlflow>=3.15.1",
    "nbformat>=5.10.4",
    "numpy>=2.3.5",
    "pandas>=2.3.3,<3",
    "plotly>=6.8.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "shap>=0.52.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
